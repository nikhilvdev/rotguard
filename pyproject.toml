[project]
name = "rotguard"
version = "0.1.0a1"
description = "Measure and guard against context rot in LLM agents (context rot, compaction, LangChain)."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Nikhil Arora" }]
keywords = ["context rot", "langchain", "llm agents", "compaction", "context engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.10"
dependencies = [
    "logquill>=1.0.0",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/nikhilvdev/rotguard"
Documentation = "https://github.com/nikhilvdev/rotguard/tree/main/docs"
Issues = "https://github.com/nikhilvdev/rotguard/issues"
Changelog = "https://github.com/nikhilvdev/rotguard/blob/main/CHANGELOG.md"

[project.scripts]
rotguard = "rotguard.cli.main:main"

[project.optional-dependencies]
langchain = ["langchain>=1.0"]
anthropic = ["anthropic"]
openai = ["openai"]
mcp = ["mcp>=2"]
otel = ["opentelemetry-api"]
eval = ["anthropic", "openai"]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "opentelemetry-sdk",
]
docs = ["mkdocs-material"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rotguard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["evals/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Importing `Callable` etc. from `typing` still works and is used throughout.
ignore = ["UP035"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/rotguard"]
