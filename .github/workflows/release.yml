name: Release

# Publishes to PyPI when a version tag such as v0.1.0a1 is pushed.
# Uses PyPI trusted publishing (OIDC): no API token is stored in this repository.
# One-time setup on pypi.org: add a (pending) trusted publisher for project "rotguard" with
# owner "nikhilvdev", repository "rotguard", workflow "release.yml" and environment "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - run: uv build

      - run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
