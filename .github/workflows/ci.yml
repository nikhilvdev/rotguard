name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6

      - run: uv python install ${{ matrix.python-version }}

      - run: uv sync --python ${{ matrix.python-version }} --extra langchain --extra anthropic

      - run: uv run ruff check .

      - run: uv run mypy

      - run: uv run pytest
