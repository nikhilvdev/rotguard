name: Bug report
description: Something in rotguard behaves wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Ideally a short script. For middleware issues, include your `middleware=[...]` list in order.
      render: python
  - type: input
    id: versions
    attributes:
      label: Versions
      description: rotguard, langchain, Python
    validations:
      required: true
